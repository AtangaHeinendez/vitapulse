name: vitapulse
description: "VitaPulse — a friendly health tracker syncing Health Connect data to Supabase."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^22.0.1
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.1.0
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  health: ^13.3.1
  intl: ^0.20.3
  lottie: ^3.4.0
  pedometer: ^4.2.0
  permission_handler: ^12.0.3
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.15.4
  timezone: ^0.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/branding/
    # Bundled Outfit/Inter so google_fonts never fetches over the network
    # (first run on mobile data) — the package picks these up automatically.
    - assets/google_fonts/

flutter_native_splash:
  background_image: assets/branding/splash_bg.png
  image: assets/branding/splash_logo.png
  android_12:
    image: assets/branding/splash_logo_a12.png
    color: "#0fb5a6"
  web: false

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#0fb5a6"
  adaptive_icon_foreground: assets/branding/icon_fg.png
  adaptive_icon_monochrome: assets/branding/icon_fg.png
  web:
    generate: true
    image_path: assets/branding/icon.png
    background_color: "#0fb5a6"
    theme_color: "#0fb5a6"
